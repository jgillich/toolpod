version: 1
caches:
  pip: ~/.cache/pip
  pdm: ~/.cache/pdm
  poetry: ~/.cache/pypoetry
mounts:
  ~/.config/pypoetry:
    source: ~/.config/pypoetry
    create: true
    read_only: false
    optional: true
  ~/.config/pdm:
    source: ~/.config/pdm
    create: true
    read_only: false
    optional: true
tools:
  python: latest
  uv: latest
  pipx:black: latest
  pipx:pytest: latest
  pipx:ruff: latest
  pdm: latest
  poetry: latest

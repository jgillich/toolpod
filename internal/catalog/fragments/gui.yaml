version: 1
packages:
  - libasound2
  - libatk-bridge2.0-0
  - libatk1.0-0
  - libatspi2.0-0
  - libcairo2
  - libcups2
  - libdbus-1-3
  - libegl1
  - libfontconfig1
  - libgbm1
  - libgl1
  - libgles2
  - libgtk-3-0
  - libnss3
  - libnspr4
  - libpango-1.0-0
  - libx11-6
  - libx11-xcb1
  - libxcb1
  - libxcomposite1
  - libxcursor1
  - libxdamage1
  - libxext6
  - libxfixes3
  - libxkbcommon0
  - libxi6
  - libxrandr2
  - libxrender1
  - libxss1
  - libxtst6
  - xdg-utils
  - dbus
  - libgstreamer1.0-0
  - libgstreamer-plugins-base1.0-0
  - gstreamer1.0-plugins-base
  - gstreamer1.0-plugins-good
  - gstreamer1.0-plugins-bad
  - gstreamer1.0-libav
  - gstreamer1.0-x
  - gstreamer1.0-alsa
  - gstreamer1.0-pulseaudio
devices:
  /dev/dri: {}
mounts:
  /tmp/.X11-unix:
    source: /tmp/.X11-unix
    optional: true
  '{{ .Env.XDG_RUNTIME_DIR }}':
    source: '{{ .Env.XDG_RUNTIME_DIR }}'
    optional: true
environment:
  XDG_RUNTIME_DIR: '{{ .Env.XDG_RUNTIME_DIR }}'
  WAYLAND_DISPLAY: '{{ .Env.WAYLAND_DISPLAY }}'
  DISPLAY: '{{ .Env.DISPLAY }}'
dbus:
  talk:
    org.freedesktop.portal.Desktop: {}

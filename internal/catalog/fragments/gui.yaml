version: 1
devices:
  /dev/dri: {}
mounts:
  /tmp/.X11-unix:
    source: /tmp/.X11-unix
    optional: true
  '{{ .Env.XDG_RUNTIME_DIR }}':
    source: '{{ .Env.XDG_RUNTIME_DIR }}'
    optional: true
environment:
  XDG_RUNTIME_DIR: '{{ .Env.XDG_RUNTIME_DIR }}'
  WAYLAND_DISPLAY: '{{ .Env.WAYLAND_DISPLAY }}'
  DISPLAY: '{{ .Env.DISPLAY }}'
dbus:
  talk:
    org.freedesktop.portal.Desktop: {}

version: 1
packages:
  - libasound2
  - libatk-bridge2.0-0
  - libatk1.0-0
  - libatspi2.0-0
  - libcairo2
  - libcups2
  - libdbus-1-3
  - libegl1
  - libfontconfig1
  - libgbm1
  - libgl1
  - libgles2
  - libgtk-3-0
  - libnss3
  - libnspr4
  - libpango-1.0-0
  - libx11-6
  - libx11-xcb1
  - libxcb1
  - libxcomposite1
  - libxcursor1
  - libxdamage1
  - libxext6
  - libxfixes3
  - libxkbcommon0
  - libxi6
  - libxrandr2
  - libxrender1
  - libxss1
  - libxtst6
  - xdg-utils
  - dbus
  - libgstreamer1.0-0
  - libgstreamer-plugins-base1.0-0
  - gstreamer1.0-plugins-base
  - gstreamer1.0-plugins-good
  - gstreamer1.0-plugins-bad
  - gstreamer1.0-libav
  - gstreamer1.0-x
  - gstreamer1.0-alsa
  - gstreamer1.0-pulseaudio
devices:
  /dev/dri: {}
mounts:
  /tmp/.X11-unix:
    source: /tmp/.X11-unix
    optional: true
  '{{ if and .Env.XDG_RUNTIME_DIR .Env.WAYLAND_DISPLAY }}{{ .Env.XDG_RUNTIME_DIR }}/{{ .Env.WAYLAND_DISPLAY }}{{ end }}':
    source: '{{ if and .Env.XDG_RUNTIME_DIR .Env.WAYLAND_DISPLAY }}{{ .Env.XDG_RUNTIME_DIR }}/{{ .Env.WAYLAND_DISPLAY }}{{ end }}'
    optional: true
environment:
  WAYLAND_DISPLAY: '{{ .Env.WAYLAND_DISPLAY }}'
  DISPLAY: '{{ .Env.DISPLAY }}'
dbus:
  talk:
    org.freedesktop.portal.Desktop: {}
files:
  /usr/local/bin/xdg-open:
    content: |
      #!/bin/sh
      # Open URLs in the host browser by forwarding to the XDG desktop portal on the
      # session bus (gui fragment mounts the host XDG_RUNTIME_DIR); fall back to the
      # real xdg-open otherwise.
      portal_open() {
        timeout 10 env LD_LIBRARY_PATH= DBUS_SESSION_BUS_ADDRESS="$1" /usr/bin/dbus-send --session --print-reply \
          --dest=org.freedesktop.portal.Desktop /org/freedesktop/portal/desktop \
          org.freedesktop.portal.OpenURI.OpenURI \
          string:'' "string:$2" dict:string:variant: >/dev/null 2>&1
      }

      case "$1" in
        [a-zA-Z][a-zA-Z0-9+.-]*:*)
          for a in "${DBUS_SESSION_BUS_ADDRESS:-}" "unix:path=${XDG_RUNTIME_DIR:-/nonexistent}/bus"; do
            [ -n "$a" ] || continue
            case "$a" in
              unix:path=*)
                p="${a#unix:path=}"
                p="${p%%,*}"
                [ -S "$p" ] || continue
                ;;
            esac
            if portal_open "$a" "$1"; then
              exit 0
            fi
          done
          ;;
      esac
      case "$0" in
        */*) self=$(readlink -f "$0") ;;
        *) self=$(command -v "$0") ;;
      esac
      if [ -x "${self%/*}/xdg-open.real" ]; then
        exec "${self%/*}/xdg-open.real" "$@"
      fi
      exec /usr/bin/xdg-open "$@"
    mode: 0755

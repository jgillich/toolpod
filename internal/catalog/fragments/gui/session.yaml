version: 1
meta:
  description: Full XDG_RUNTIME_DIR session mount (GUI)
packages:
  - libasound2
  - gstreamer1.0-alsa
  - gstreamer1.0-pulseaudio
mounts:
  '{{ .Env.XDG_RUNTIME_DIR }}':
    source: '{{ .Env.XDG_RUNTIME_DIR }}'
    optional: true
environment:
  XDG_RUNTIME_DIR: '{{ .Env.XDG_RUNTIME_DIR }}'

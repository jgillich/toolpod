version: 1
meta:
  description: Isolated nested podman engine as a service
tools:
  docker-cli: latest
  podman: latest
  docker-compose: latest
  hadolint: latest
services:
  podman:
    image: debian:13-slim
    packages:
      - podman
      - aardvark-dns
      - nftables
      - iptables
      - iproute2
      - catatonit
      - ca-certificates
      - procps
    files:
      # The nested podman's default network (10.88.0.0/16) collides with the
      # outer podman network the service container itself is attached to, so
      # launch containers lose routing; pick a subnet the outer network does
      # not use.
      /etc/containers/containers.conf:
        content: |
          [network]
          default_subnet = "172.20.0.0/16"
    privileged: true
    caches:
      podman-storage:
        - /var/lib/containers/storage
    command:
      - podman
      - system
      - service
      - -t
      - "0"
      - unix:///run/podman/podman.sock
    exposes:
      podman: /run/podman/podman.sock
mounts:
  /var/run/docker.sock:
    service: podman
    socket: podman
environment:
  DOCKER_HOST: unix:///var/run/docker.sock

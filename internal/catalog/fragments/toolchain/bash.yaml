version: 1
meta:
  description: Bash shell config mounts and shellcheck
tools:
  shellcheck: latest
mounts:
  ~/.bashrc:
    source: ~/.bashrc
    optional: true
  ~/.bash_profile:
    source: ~/.bash_profile
    optional: true
  ~/.bash_aliases:
    source: ~/.bash_aliases
    optional: true
  ~/.profile:
    source: ~/.profile
    optional: true
  ~/.inputrc:
    source: ~/.inputrc
    optional: true
packages:
  - bash

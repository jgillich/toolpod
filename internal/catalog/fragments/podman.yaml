version: 1
tools:
  podman: latest
  docker-compose: latest
  hadolint: latest
mounts:
  /var/run/docker.sock:
    source: '{{ or (trimPrefix (index .Env "DOCKER_HOST") "unix://") (printf "/run/user/%s/podman/podman.sock" (uid)) }}'
    read_only: false
    optional: true
environment:
  DOCKER_HOST: unix:///var/run/docker.sock

version: 1
caches:
  wrangler: ~/.cache/.wrangler
mounts:
  ~/.config/.wrangler:
    source: ~/.config/.wrangler
    create: true
    read_only: false
    optional: true
  ~/.cloudflared:
    source: ~/.cloudflared
    create: true
    read_only: false
    optional: true
  ~/.fly:
    source: ~/.fly
    create: true
    read_only: false
    optional: true
  ~/.config/com.vercel.cli:
    source: ~/.config/com.vercel.cli
    create: true
    read_only: false
    optional: true
tools:
  cloudflared: latest
  flyctl: latest
  vercel: latest
  wrangler: latest

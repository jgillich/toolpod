version: 1
meta:
  description: Host docker socket
tools:
  docker-cli: latest
  docker-compose: latest
  hadolint: latest
mounts:
  /var/run/docker.sock:
    source: '{{ or (trimPrefix (index .Env "DOCKER_HOST") "unix://") "/var/run/docker.sock" }}'
    read_only: false
    optional: true
environment:
  DOCKER_HOST: unix:///var/run/docker.sock

version: 1
meta:
  description: Disposable PowerShell shell
extends:
  - defaults
  - mise
command: ["pwsh"]
packages:
  - libicu76
mounts:
  ~/.config/powershell:
    source: ~/.config/powershell
    create: true
    read_only: false
    optional: true
  ~/.local/share/powershell:
    source: ~/.local/share/powershell
    create: true
    read_only: false
    optional: true
tools:
  powershell-core: latest

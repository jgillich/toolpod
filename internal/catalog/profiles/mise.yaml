version: 1
meta:
  description: The mise toolchain base with common CLI tools
image: debian:13-slim
command: ["/usr/bin/mise"]
repos:
  mise:
    extrepo: mise
packages:
  - mise
  - autoconf
  - bsdextrautils
  - file
  - curl
  - git
  - build-essential
  - cmake
  - python3
  - libssl-dev
  - libcurl4-openssl-dev
  - zlib1g-dev
  - libreadline-dev
  - libffi-dev
  - libsqlite3-dev
  - gettext
  - openssl
  - gdb
  - strace
mounts:
  /etc/mise:
    source: ~/.config/mise
    optional: true
caches:
  mise:
    - ~/.local/share/mise
    - ~/.cache/mise
    - ~/.aube
tools:
  bat: latest
  fd: latest
  fzf: latest
  git-lfs: latest
  jq: latest
  just: latest
  ripgrep: latest
  task: latest
  yq: latest
files:
  /etc/profile.d/mise.sh:
    content: |
      if command -v mise >/dev/null 2>&1; then
        eval "$(mise hook-env)"
      fi

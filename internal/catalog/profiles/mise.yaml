version: 1
image: ghcr.io/jgillich/tpod-mise:latest
command: ["/usr/bin/mise"]
repos:
  mise:
    extrepo: mise
packages:
  - mise
  - curl
  - git
  - build-essential
  - cmake
  - ninja-build
  - clang
  - pkg-config
  - autoconf
  - automake
  - libtool
  - bison
  - re2c
  - python3
  - libssl-dev
  - libcurl4-openssl-dev
  - zlib1g-dev
  - libreadline-dev
  - libffi-dev
  - libsqlite3-dev
  - libedit-dev
  - gettext
  - openssl
  - gdb
mounts:
  /etc/mise:
    source: ~/.config/mise
    optional: true
tools:
  bat: latest
  fd: latest
  fzf: latest
  jq: latest
  ripgrep: latest
  yq: latest

version: 1
meta:
  description: The mise toolchain base
extends: defaults
image: debian:13-slim
command: ["/usr/bin/mise"]
repos:
  mise:
    extrepo: mise
packages:
  - mise
mounts:
  /etc/mise:
    source: ~/.config/mise
    optional: true
caches:
  mise:
    - ~/.local/share/mise
    - ~/.cache/mise
    - ~/.aube
files:
  /etc/profile.d/mise.sh:
    content: |
      if command -v mise >/dev/null 2>&1; then
        eval "$(mise hook-env)"
      fi

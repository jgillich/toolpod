version: 1
image: debian:13-slim
command: ["/usr/bin/mise"]
repos:
  mise:
    extrepo: mise
packages:
  - mise
  - curl
  - git
  - build-essential
  - cmake
  - python3
  - libssl-dev
  - libcurl4-openssl-dev
  - zlib1g-dev
  - libreadline-dev
  - libffi-dev
  - libsqlite3-dev
  - gettext
  - openssl
  - gdb
mounts:
  /etc/mise:
    source: ~/.config/mise
    optional: true
tools:
  bat: latest
  fd: latest
  fzf: latest
  git-lfs: latest
  jq: latest
  just: latest
  ripgrep: latest
  task: latest
  yq: latest

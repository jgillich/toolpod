version: 1
image: ghcr.io/jdx/mise:latest
command: ["opencode"]
tools:
  opencode: latest
mounts:
  ~/.config/opencode:
    source: ~/.config/opencode
    read_only: true
  ~/.cache/opencode:
    source: ~/.cache/opencode
    read_only: false
  ~/.local/share/opencode:
    source:  ~/.local/share/opencode
    read_only: false
labels:
  profile: opencode
network: bridge
tty: auto

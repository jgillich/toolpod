version: 1
meta:
  description: The opencode AI agent
extends: mise
command: ["opencode"]
tools:
  opencode: latest
mounts:
  ~/.config/opencode:
    source: ~/.config/opencode
    create: true
  ~/.cache/opencode:
    source: ~/.cache/opencode
    create: true
    read_only: false
  ~/.local/share/opencode:
    source: ~/.local/share/opencode
    create: true
    read_only: false

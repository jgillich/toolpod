version: 1
extends:
  - mise
  - gui
  - codex
  - claude
command: ["buzz"]
network: host # fixme callback url on random port
tools:
  "appimage:block/buzz": latest
mounts:
  ~/.local/share/xyz.block.buzz.app:
    source: ~/.local/share/xyz.block.buzz.app
    create: true
    read_only: false
  ~/.config/xyz.block.buzz.app:
    source: ~/.config/xyz.block.buzz.app
    create: true
    read_only: false
  ~/.buzz:
    source: ~/.buzz
    create: true
    read_only: false
dbus:
  talk:
    org.freedesktop.Notifications: {}
  own:
    xyz.block.buzz.app: {}

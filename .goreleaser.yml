version: 2

project_name: tpd

builds:
  - main: ./cmd/tpd
    binary: tpd
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64

archives:
  - id: default
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz

checksum:
  name_template: checksums.txt
  algorithm: sha256

# Release hardening: an SBOM per archive; checksums are already enabled above.
sboms:
  - artifacts: archive
    documents:
      - "${artifact}.sbom"
    cmd: syft
    args: ["$artifact", "--output", "spdx-json=$document", "--enrich", "all"]

changelog:
  use: git

release:
  github:
    owner: jgillich
    name: tpd
